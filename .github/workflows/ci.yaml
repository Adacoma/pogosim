name: GitHub Actions CI build

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: write   # needed so actions-gh-pages can push to gh-pages

jobs:
  documentation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Doxygen documentation
        uses: mattnotmitt/doxygen-action@v1.1.0
        with:
          doxyfile-path: "./Doxyfile"
          working-directory: "."

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'  # only deploy on pushes to main
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/html

  build-and-test:
    strategy:
      matrix:
        # The Windows entry exercises WSL2; native Windows has its own job below.
        os: [ubuntu-latest, ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install dependencies (Ubuntu)
      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake git libboost-system-dev libsdl2-dev libsdl2-image-dev libsdl2-gfx-dev libsdl2-ttf-dev libyaml-cpp-dev libspdlog-dev wget unzip ca-certificates lsb-release

          # Install Apache Arrow
          wget https://apache.jfrog.io/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt install -y -V ./apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt update
          sudo apt install -y -V libarrow-dev

          # Install Box2D
          git clone https://github.com/erincatto/box2d.git
          cd box2d
          git checkout 28adacf82377d4113f2ed00586141463244b9d10
          mkdir build
          cd build
          cmake -DBOX2D_SAMPLES=OFF -DBOX2D_UNIT_TESTS=OFF -DBOX2D_DOCS=OFF -DGLFW_BUILD_WAYLAND=OFF -DCMAKE_INSTALL_PREFIX=/usr ..
          cmake --build .
          sudo cmake --install .
          cd ../..

          # Python3 + pip3
          sudo apt-get install -y python3 python3-pip
          python3 -m venv .venv
          source .venv/bin/activate
          python3 -m pip install --upgrade pip
          cd scripts
          python3 -m pip install -r requirements.txt
          python3 -m pip install '.[optim]'

      # Step 2: Install dependencies (macOS)
      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install boost sdl2 sdl2_image sdl2_gfx sdl2_ttf yaml-cpp spdlog apache-arrow pkg-config fmt

          # Install Box2D
          git clone https://github.com/erincatto/box2d.git
          cd box2d
          git checkout 28adacf82377d4113f2ed00586141463244b9d10
          mkdir build
          cd build
          cmake -DBOX2D_SAMPLES=OFF -DBOX2D_UNIT_TESTS=OFF -DBOX2D_DOCS=OFF -DGLFW_BUILD_WAYLAND=OFF -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_INSTALL_LIBDIR=/usr/local/lib -DCMAKE_INSTALL_INCLUDEDIR=/usr/local/include ..
          cmake --build .
          sudo cmake --install .
          cd ../..

          # Python 3 + pip3 (Homebrew)
          brew install python || brew upgrade python
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          cd scripts
          python -m pip install -r requirements.txt
          python -m pip install .

      - name: Setup WSL2 (Ubuntu 24.04)
        if: matrix.os == 'windows-latest'
        uses: Vampire/setup-wsl@v6
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          update: 'true'
          additional-packages: >-
            build-essential cmake ninja-build pkg-config git ca-certificates lsb-release wget gpg
            libboost-system-dev libsdl2-dev libsdl2-image-dev libsdl2-gfx-dev libsdl2-ttf-dev
            libyaml-cpp-dev libspdlog-dev wget unzip ca-certificates lsb-release

      - name: Install dependencies (Windows+WSL2)
        if: matrix.os == 'windows-latest'
        shell: wsl-bash {0}
        run: |
          git config --global --add safe.directory "$(wslpath "$GITHUB_WORKSPACE")"
          set -euxo pipefail
          REPO="$(wslpath -u '${{ github.workspace }}')"
          cd "$REPO"

          # Install Apache Arrow
          wget https://apache.jfrog.io/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt install -y -V ./apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt update
          sudo apt install -y -V libarrow-dev dos2unix

          # Install Box2D
          git clone https://github.com/erincatto/box2d.git
          cd box2d
          git checkout 28adacf82377d4113f2ed00586141463244b9d10
          mkdir build
          cd build
          cmake -DBOX2D_SAMPLES=OFF -DBOX2D_UNIT_TESTS=OFF -DBOX2D_DOCS=OFF -DGLFW_BUILD_WAYLAND=OFF -DCMAKE_INSTALL_PREFIX=/usr ..
          cmake --build .
          sudo cmake --install .
          cd ../..

          # Python 3 + pip3 in WSL
          sudo apt install -y python3 python3-pip python3-venv
          python3 -m venv .venv
          source .venv/bin/activate
          python3 -m pip install --upgrade pip
          cd scripts
          python3 -m pip install -r requirements.txt
          python3 -m pip install .

      # Step 3: Build the project
      - name: Build
        if: matrix.os != 'windows-latest'
        run: |
          ./build.sh Release

      - name: Build (Windows+WSL2)
        if: matrix.os == 'windows-latest'
        shell: wsl-bash {0}
        run: |
          set -euxo pipefail
          REPO="$(wslpath -u '${{ github.workspace }}')"
          cd "$REPO"
          dos2unix ./build.sh || true
          bash ./build.sh Release

      - name: Test Python batch and optimization tools
        if: matrix.os != 'windows-latest'
        run: |
          source .venv/bin/activate
          python3 -m unittest discover -s scripts/python_tests -v

      - name: Test Python batch and optimization tools (Windows+WSL2)
        if: matrix.os == 'windows-latest'
        shell: wsl-bash {0}
        run: |
          REPO="$(wslpath -u '${{ github.workspace }}')"
          cd "$REPO"
          source .venv/bin/activate
          python3 -m unittest discover -s scripts/python_tests -v

      # Step 4: Run tests
      - name: Launch Pogosim
        if: matrix.os != 'windows-latest'
        run: |
          source .venv/bin/activate
          ./examples/blooming/blooming -c conf/pair.yaml -g -nr
          ./examples/IMU/IMU -c conf/pair.yaml -g -nr
          ./examples/neighbor_counter/neighbor_counter -c conf/pair.yaml -g -nr
          ./examples/walls/walls -c conf/pair.yaml -g -nr
          ./examples/cpp_helloworld/cpp_helloworld -c conf/pair.yaml -g -nr
          ./scripts/pogosim/pogobatch.py run -c conf/pair.yaml -S examples/blooming/blooming -r 1 -t tmp -o results/tmp
          cd template_prj && make clean sim && ./template_prj -c conf/test.yaml -g -nr && cd ..

      # Step 4: Run tests
      - name: Launch Pogosim (Windows+WSL2)
        if: matrix.os == 'windows-latest'
        shell: wsl-bash {0}
        run: |
          set -euxo pipefail
          REPO="$(wslpath -u '${{ github.workspace }}')"
          cd "$REPO"
          source .venv/bin/activate
          ./examples/blooming/blooming -c conf/pair.yaml -g -nr
          ./examples/IMU/IMU -c conf/pair.yaml -g -nr
          ./examples/neighbor_counter/neighbor_counter -c conf/pair.yaml -g -nr
          ./examples/walls/walls -c conf/pair.yaml -g -nr
          ./examples/cpp_helloworld/cpp_helloworld -c conf/pair.yaml -g -nr
          python ./scripts/pogosim/pogobatch.py run -c conf/pair.yaml -S examples/blooming/blooming -r 1 -t tmp -o results/tmp
          cd template_prj && make clean sim && ./template_prj -c conf/test.yaml -g -nr && cd ..

  windows-native-build-and-test:
    name: Native Windows (MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        # UCRT64 produces native Windows executables; it is not a WSL shell.
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up native Windows toolchain and dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_image
            mingw-w64-ucrt-x86_64-SDL2_gfx
            mingw-w64-ucrt-x86_64-SDL2_ttf
            mingw-w64-ucrt-x86_64-yaml-cpp
            mingw-w64-ucrt-x86_64-spdlog
            mingw-w64-ucrt-x86_64-arrow
            mingw-w64-ucrt-x86_64-fmt

      - name: Build the pinned Box2D 3.x revision
        run: |
          set -euxo pipefail
          # Match the Box2D 3.x revision used by the Linux, macOS, and WSL2 jobs.
          git clone https://github.com/erincatto/box2d.git box2d-windows-native
          git -C box2d-windows-native checkout 28adacf82377d4113f2ed00586141463244b9d10
          cmake -S box2d-windows-native -B box2d-windows-native/build -G Ninja \
            -DBOX2D_SAMPLES=OFF \
            -DBOX2D_UNIT_TESTS=OFF \
            -DBOX2D_DOCS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/ucrt64
          cmake --build box2d-windows-native/build --parallel
          cmake --install box2d-windows-native/build

      - name: Build Pogosim natively
        run: |
          set -euxo pipefail
          cmake -S . -B build-windows-native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/ucrt64
          cmake --build build-windows-native --parallel
          cmake --install build-windows-native

      - name: Build and run native simulator smoke test
        run: |
          set -euxo pipefail
          # Override the target suffix because MinGW appends .exe automatically.
          make -C examples/test_flash_state clean sim SIM_TARGET=test_flash_state.exe
          # The hosted Windows runner has no interactive display.
          export SDL_VIDEODRIVER=dummy
          ./examples/test_flash_state/test_flash_state.exe \
            -c examples/test_flash_state/conf/export.yaml -g -nr
          ./examples/test_flash_state/test_flash_state.exe \
            -c examples/test_flash_state/conf/import.yaml -g -nr

      - name: Set up native CPython
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Python batch and optimization tools natively
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          Push-Location scripts
          python -m pip install .
          Pop-Location
          python -m unittest discover -s scripts/python_tests -v

